<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dark cyber background gradient -->
    <radialGradient id="cyberBackground" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </radialGradient>
    
    <!-- Neon indigo gradient for lock -->
    <linearGradient id="neonLock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glowing effect filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Strong glow for text -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Matrix-style animation -->
    <animate id="matrixFlicker" attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
  </defs>
  
  <!-- Dark cyber background -->
  <rect x="0" y="0" width="400" height="400" fill="url(#cyberBackground)"/>
  
  <!-- Circuit board pattern background -->
  <g stroke="#1e3a8a" stroke-width="0.8" fill="none" opacity="0.3">
    <!-- Horizontal circuit lines -->
    <line x1="0" y1="50" x2="120" y2="50"/>
    <line x1="280" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="150" x2="80" y2="150"/>
    <line x1="320" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="250" x2="100" y2="250"/>
    <line x1="300" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="350" x2="120" y2="350"/>
    <line x1="280" y1="350" x2="400" y2="350"/>
    
    <!-- Vertical circuit lines -->
    <line x1="60" y1="0" x2="60" y2="120"/>
    <line x1="60" y1="280" x2="60" y2="400"/>
    <line x1="340" y1="0" x2="340" y2="100"/>
    <line x1="340" y1="300" x2="340" y2="400"/>
    
    <!-- Circuit nodes -->
    <circle cx="60" cy="50" r="2"/>
    <circle cx="340" cy="50" r="2"/>
    <circle cx="60" cy="350" r="2"/>
    <circle cx="340" cy="350" r="2"/>
    <rect x="58" y="148" width="4" height="4"/>
    <rect x="338" y="248" width="4" height="4"/>
  </g>
  
  <!-- Matrix-style binary code -->
  <g font-family="'Courier New', monospace" font-size="10" fill="#00ff41" opacity="0.2">
    <text x="30" y="80">01001001</text>
    <text x="320" y="90">11010110</text>
    <text x="25" y="180">10110101</text>
    <text x="315" y="190">01101001</text>
    <text x="35" y="280">11001010</text>
    <text x="310" y="290">00111101</text>
    <text x="30" y="380">10101110</text>
    <text x="320" y="370">11100011</text>
  </g>
  
  <!-- "Got AD CS?" text with cyber styling -->
  <text x="200" y="70" text-anchor="middle" fill="#00f5ff" font-family="'Orbitron', 'Courier New', monospace" 
        font-size="24" font-weight="900" letter-spacing="2px" filter="url(#textGlow)">
    &gt; GOT_AD_CS?
  </text>
  
  <!-- Hexagonal tech frame around lock -->
  <polygon points="140,120 160,110 240,110 260,120 260,250 240,260 160,260 140,250" 
           fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6" filter="url(#neonGlow)"/>
  
  <!-- Main lock with cyber styling -->
  <g filter="url(#neonGlow)">
    <!-- Lock shackle with tech details -->
    <path d="M 170 135 A 30 30 0 0 1 230 135 L 230 170 L 225 170 L 225 145 A 25 25 0 0 0 175 145 L 175 170 L 170 170 Z" 
          fill="none" stroke="#00f5ff" stroke-width="3"/>
    <path d="M 215 170 L 210 170 L 210 148 A 22 22 0 0 0 190 148 L 190 170 L 185 170" 
          fill="none" stroke="#6366f1" stroke-width="2"/>
    
    <!-- Lock body with digital styling -->
    <rect x="155" y="170" width="90" height="65" rx="8" ry="8" fill="#0a0a1a" stroke="#3b82f6" stroke-width="2"/>
    <rect x="160" y="175" width="80" height="55" rx="4" ry="4" fill="none" stroke="#1e3a8a" stroke-width="1"/>
    
    <!-- Digital keyhole -->
    <polygon points="200,185 207,192 200,199 193,192" fill="#00f5ff"/>
    <rect x="198" y="199" width="4" height="8" fill="#00f5ff"/>
    
    <!-- Terminal prompt with enhanced styling -->
    <g transform="translate(165, 205)">
      <!-- Command prompt -->
      <text fill="#00ff41" font-family="'Courier New', monospace" font-size="12" font-weight="bold">root@</text>
      <!-- Blinking cursor -->
      <rect x="25" y="2" width="8" height="10" fill="#00ff41">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- Lock status LED indicators -->
    <circle cx="165" cy="180" r="2" fill="#ff0040"/>
    <circle cx="235" cy="180" r="2" fill="#00ff41"/>
    <circle cx="165" cy="225" r="2" fill="#ffa500"/>
    <circle cx="235" cy="225" r="2" fill="#3b82f6"/>
  </g>
  
  <!-- "Invoke-Locksmith" with hacker styling -->
  <text x="200" y="320" text-anchor="middle" fill="#00f5ff" font-family="'Orbitron', 'Courier New', monospace" 
        font-size="28" font-weight="900" letter-spacing="1px" filter="url(#textGlow)">
    INVOKE-LOCKSMITH
  </text>
  
  <!-- Cyber security elements -->
  <g opacity="0.6">
    <!-- Scanning lines -->
    <line x1="0" y1="140" x2="400" y2="140" stroke="#00ff41" stroke-width="1" opacity="0.3">
      <animate attributeName="y1" values="140;260;140" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="140;260;140" dur="3s" repeatCount="indefinite"/>
    </line>
    
    <!-- Security protocol indicators -->
    <g font-family="'Courier New', monospace" font-size="8" fill="#00ff41">
      <text x="20" y="30" opacity="0.5">SCAN_ACTIVE</text>
      <text x="300" y="30" opacity="0.5">PKI_AUDIT</text>
      <text x="20" y="380" opacity="0.5">SSL_CHECK</text>
      <text x="300" y="380" opacity="0.5">CERT_ENUM</text>
    </g>
    
    <!-- Corner brackets -->
    <g stroke="#3b82f6" stroke-width="2" fill="none">
      <path d="M 20 20 L 20 40 M 20 20 L 40 20"/>
      <path d="M 380 20 L 360 20 M 380 20 L 380 40"/>
      <path d="M 20 380 L 20 360 M 20 380 L 40 380"/>
      <path d="M 380 380 L 380 360 M 380 380 L 360 380"/>
    </g>
    
    <!-- Data streams -->
    <g font-family="'Courier New', monospace" font-size="6" fill="#1e3a8a">
      <text x="50" y="120" transform="rotate(-90 50 120)">0xDEADBEEF</text>
      <text x="350" y="280" transform="rotate(90 350 280)">0xCAFEBABE</text>
    </g>
  </g>
</svg>